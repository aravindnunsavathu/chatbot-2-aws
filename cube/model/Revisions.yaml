cubes:
  - name: Revisions
    sql_table: fivebyfive.revisions
    description: "A design revision layer applied on top of a 3D model, representing proposed or actual changes to the structure (e.g. adding new equipment). Revisions track the design state and can be scoped to a tenant."

    joins:
      - name: Companies
        sql: "{TABLE}.creator_company_id = {Companies}.id"
        relationship: many_to_one
      - name: Models
        sql: "{TABLE}.model_id = {Models}.id"
        relationship: many_to_one
      - name: AssetVersions
        sql: "{AssetVersions}.base_model_id = {TABLE}.model_id"
        relationship: many_to_one
      - name: Tenants
        sql: "{TABLE}.tenant_id = {Tenants}.id"
        relationship: many_to_one

    measures:
      - name: count
        type: count
        description: "Total number of revisions"
      - name: avg_days_to_confirmation
        sql: "CASE WHEN design_state = 'CONFIRMED' THEN EXTRACT(EPOCH FROM (last_edited_on - created_on)) / 86400.0 END"
        type: avg
        description: "Average days from revision creation to confirmation (CONFIRMED state). Use as a proxy for design simulation approval time."

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true
      - name: ddb_id
        sql: ddb_id
        type: string
        description: "Legacy identifier from an external database"
      - name: model_id
        sql: model_id
        type: string
        description: "The 3D model this revision is applied to"
      - name: created_by
        sql: created_by
        type: string
      - name: created_on
        sql: created_on
        type: time
      - name: deleted_by
        sql: deleted_by
        type: string
        description: "Username of who deleted this revision"
      - name: deleted_on
        sql: deleted_on
        type: time
        description: "Timestamp when soft-deleted"
      - name: display_name
        sql: display_name
        type: string
      - name: is_deleted
        sql: is_deleted
        type: boolean
        description: "Whether this revision has been soft-deleted"
      - name: is_preset
        sql: is_preset
        type: boolean
        description: "Whether this is a system-created default revision"
      - name: is_public
        sql: is_public
        type: boolean
        description: "Whether visible to all users with model access"
      - name: last_edited_by
        sql: last_edited_by
        type: string
      - name: last_edited_on
        sql: last_edited_on
        type: time
      - name: tenant_id
        sql: tenant_id
        type: string
        description: "Tenant this revision belongs to"
      - name: customer_data
        sql: customer_data
        type: string
        description: "JSON object with customer-specific metadata"
      - name: revision_type
        sql: revision_type
        type: string
        description: "Type of revision (e.g. design, as_built, proposed)"
      - name: creator_company_id
        sql: creator_company_id
        type: string
        description: "Company that created this revision"
      - name: design_state
        sql: design_state
        type: string
        description: "Current state of the design. Actual values: DRAFT (in progress / pending), CONFIRMED (approved / complete), LUMEA_OUT_OF_SYNC (external sync issue)."
