cubes:
  - name: AssetVersionCompanyAccessRights
    sql_table: fivebyfive.asset_version_company_access_rights
    description: "Access control table that defines which companies have rights to view a specific asset version."

    joins:
      - name: AssetVersions
        sql: "{TABLE}.asset_version_id = {AssetVersions}.id"
        relationship: many_to_one
      - name: Companies
        sql: "{TABLE}.company_id = {Companies}.id"
        relationship: many_to_one

    measures:
      - name: count
        type: count
        description: "Total number of asset version company access rights"

    dimensions:
      - name: company_id
        sql: company_id
        type: string
        description: "The company being granted access"
      - name: asset_version_id
        sql: asset_version_id
        type: string
        description: "The asset version being accessed"
      - name: granted_on
        sql: granted_on
        type: time
        description: "Timestamp when access was granted"
