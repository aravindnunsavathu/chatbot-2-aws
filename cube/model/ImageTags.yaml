cubes:
  - name: ImageTags
    sql_table: fivebyfive.image_tags
    description: "Annotation tags applied to specific positions within images of an asset version, marking field values or features at image coordinates."

    joins:
      - name: AssetVersions
        sql: "{TABLE}.asset_version_id = {AssetVersions}.id"
        relationship: many_to_one

    measures:
      - name: count
        type: count
        description: "Total number of image tags"

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true
      - name: ddb_id
        sql: ddb_id
        type: string
        description: "Legacy identifier from an external database"
      - name: asset_version_id
        sql: asset_version_id
        type: string
        description: "The asset version whose images are tagged"
      - name: asset_version_index
        sql: asset_version_index
        type: number
        description: "Index of the specific image within the asset version"
      - name: created_by
        sql: created_by
        type: string
      - name: created_on
        sql: created_on
        type: time
      - name: deleted_by
        sql: deleted_by
        type: string
        description: "Username of who deleted this tag"
      - name: deleted_on
        sql: deleted_on
        type: time
        description: "Timestamp when soft-deleted"
      - name: field_name
        sql: field_name
        type: string
        description: "Name of the field or attribute being tagged"
      - name: field_value
        sql: field_value
        type: number
        description: "Value of the field at this position"
      - name: image_path
        sql: image_path
        type: string
        description: "Storage path to the image"
      - name: is_deleted
        sql: is_deleted
        type: boolean
        description: "Whether this tag has been soft-deleted"
      - name: position
        sql: position
        type: string
        description: "2D coordinates within the image where this tag is placed"
      - name: tag_type
        sql: tag_type
        type: string
        description: "Type/category of this image tag"
      - name: text_content
        sql: text_content
        type: string
        description: "Optional text annotation content"
