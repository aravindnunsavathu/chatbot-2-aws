cubes:
  - name: Collections
    sql_table: fivebyfive.collections
    description: "Named groups of files within a model, used to organize related files together. Can be nested hierarchically via parent_id."

    joins:
      - name: Models
        sql: "{TABLE}.model_id = {Models}.id"
        relationship: many_to_one
      - name: Collections
        sql: "{TABLE}.parent_id = {Collections}.id"
        relationship: many_to_one
      - name: Tenants
        sql: "{TABLE}.tenant_id = {Tenants}.id"
        relationship: many_to_one

    measures:
      - name: count
        type: count
        description: "Total number of collections"

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true
      - name: ddb_id
        sql: ddb_id
        type: string
        description: "Legacy identifier from an external database"
      - name: model_id
        sql: model_id
        type: string
        description: "The 3D model this collection belongs to"
      - name: created_by
        sql: created_by
        type: string
      - name: created_on
        sql: created_on
        type: time
      - name: deleted_by
        sql: deleted_by
        type: string
        description: "Username of the user who deleted this collection"
      - name: deleted_on
        sql: deleted_on
        type: time
        description: "Timestamp when the collection was soft-deleted"
      - name: display_name
        sql: display_name
        type: string
      - name: is_deleted
        sql: is_deleted
        type: boolean
        description: "Whether this collection has been soft-deleted"
      - name: is_preset
        sql: is_preset
        type: boolean
        description: "Whether this is a system-created default collection"
      - name: is_public
        sql: is_public
        type: boolean
        description: "Whether this collection is visible to all users with model access"
      - name: tenant_id
        sql: tenant_id
        type: string
        description: "Tenant scoping for this collection"
      - name: parent_id
        sql: parent_id
        type: string
        description: "Parent collection for nested hierarchy (null if top-level)"
