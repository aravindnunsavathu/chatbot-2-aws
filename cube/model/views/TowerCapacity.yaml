views:
  - name: TowerCapacity
    description: "Structural capacity utilization per tower. Combines the structure's design capacity (from asset versions) with the total weight of installed equipment (from volumes + physical component catalog). Use for questions about available space, towers near capacity, towers under-utilized, and where equipment can be added."

    cubes:
      - join_path: Volumes
        includes:
          - count
          - min_volume_created_on
          - installation_status
          - volume_type

      - join_path: Volumes.PhysicalComponents
        prefix: true
        includes:
          - total_weight_kg
          - weight_kg
          - manufacturer
          - model_identifier
          - category

      - join_path: Volumes.AssetVersions
        prefix: true
        includes:
          - active
          - structure_design_capacity
          - structure_design_height
          - structure_height
          - height

      - join_path: Volumes.AssetVersions.Assets
        prefix: true
        includes:
          - display_id
          - asset_name
          - asset_type
          - structure_type
          - latitude
          - longitude

      - join_path: Volumes.AssetVersions.Assets.Sites
        prefix: true
        includes:
          - display_id
          - site_name
          - address_state
          - address_region
          - address_zip
