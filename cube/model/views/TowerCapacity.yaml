views:
  - name: TowerCapacity
    description: "Equipment inventory and structural dimensions per tower. Use for browsing installed equipment by site, filtering by volume type or installation status, and looking up structure heights. Do NOT use for capacity percentage or utilisation ratio calculations — route those to direct SQL instead."

    cubes:
      - join_path: Volumes
        includes:
          - count
          - min_volume_created_on
          - installation_status
          - volume_type

      - join_path: Volumes.PhysicalComponents
        prefix: true
        includes:
          - total_weight_kg
          - weight_kg
          - manufacturer
          - model_identifier
          - category

      - join_path: Volumes.AssetVersions
        prefix: true
        includes:
          - active
          - structure_design_capacity
          - structure_design_height
          - structure_height
          - height

      - join_path: Volumes.AssetVersions.Assets
        prefix: true
        includes:
          - display_id
          - asset_name
          - asset_type
          - structure_type
          - latitude
          - longitude

      - join_path: Volumes.AssetVersions.Assets.Sites
        prefix: true
        includes:
          - display_id
          - site_name
          - address_state
          - address_region
          - address_zip
