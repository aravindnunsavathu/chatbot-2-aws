views:
  - name: EquipmentVolumes
    description: "3D volumetric equipment placements on asset versions, representing physical hardware installed on structures. Use for equipment inventory, installation status, and volume type breakdowns."

    cubes:
      - join_path: Volumes
        includes:
          - id
          - display_name
          - volume_type
          - installation_status
          - center_height
          - dimension_1
          - dimension_2
          - dimension_3
          - azimuth
          - downtilt
          - roll
          - count
          - min_volume_created_on
          - total_weight_kg

      - join_path: Volumes.AssetVersions
        prefix: true
        includes:
          - capture_date
          - processing_status
          - active
          - project_name
          - structure_design_capacity
          - structure_design_height
          - structure_height
          - height

      - join_path: Volumes.AssetVersions.Assets
        prefix: true
        includes:
          - display_id
          - asset_name
          - asset_type

      - join_path: Volumes.AssetVersions.Assets.Sites
        prefix: true
        includes:
          - site_name
          - address_state

      - join_path: Volumes.PhysicalComponents
        prefix: true
        includes:
          - manufacturer
          - model_identifier
          - category
          - total_weight_kg
