cubes:
  - name: VerticalSegments
    sql_table: fivebyfive.vertical_segments
    description: "Vertical measurement segments within a 3D model defined by a bottom and top elevation. Used to measure and annotate vertical extents of structural elements like legs or sections."

    joins:
      - name: Models
        sql: "{TABLE}.model_id = {Models}.id"
        relationship: many_to_one
      - name: Measurements
        sql: "{TABLE}.parent_measurement_id = {Measurements}.id"
        relationship: many_to_one
      - name: Tenants
        sql: "{TABLE}.tenant_id = {Tenants}.id"
        relationship: many_to_one

    measures:
      - name: count
        type: count
        description: "Total number of vertical segments"

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true
      - name: ddb_id
        sql: ddb_id
        type: string
        description: "Legacy identifier from an external database"
      - name: model_id
        sql: model_id
        type: string
        description: "The 3D model this segment belongs to"
      - name: created_by
        sql: created_by
        type: string
      - name: created_on
        sql: created_on
        type: time
      - name: display_name
        sql: display_name
        type: string
      - name: is_preset
        sql: is_preset
        type: boolean
        description: "Whether this is a system-created default segment"
      - name: is_public
        sql: is_public
        type: boolean
        description: "Whether visible to all users with model access"
      - name: last_edited_by
        sql: last_edited_by
        type: string
      - name: last_edited_on
        sql: last_edited_on
        type: time
      - name: bottom_elevation
        sql: bottom_elevation
        type: number
        description: "Elevation of the bottom of this segment in model units"
      - name: top_elevation
        sql: top_elevation
        type: number
        description: "Elevation of the top of this segment in model units"
      - name: tenant_id
        sql: tenant_id
        type: string
        description: "Tenant scoping for this segment"
      - name: parent_measurement_id
        sql: parent_measurement_id
        type: string
        description: "Parent measurement this segment belongs to"
      - name: parent_group
        sql: parent_group
        type: string
        description: "Display group name"
      - name: has_level
        sql: has_level
        type: boolean
        description: "Whether this segment has a level/elevation reference"
