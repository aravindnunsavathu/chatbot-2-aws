cubes:
  - name: GeorefTasks
    sql_table: fivebyfive.georef_tasks
    description: "Background tasks for georeferencing a 3D model — aligning it to real-world geographic coordinates."

    joins:
      - name: Models
        sql: "{TABLE}.model_id = {Models}.id"
        relationship: many_to_one

    measures:
      - name: count
        type: count
        description: "Total number of georef tasks"

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true
      - name: model_id
        sql: model_id
        type: string
        description: "The model being georeferenced"
      - name: task_arn
        sql: task_arn
        type: string
        description: "AWS ARN of the background processing task"
      - name: task_status
        sql: task_status
        type: string
        description: "Current status of the georeferencing task"
      - name: task_token
        sql: task_token
        type: string
        description: "Token for resuming async task execution"
