cubes:
  - name: Models
    sql_table: fivebyfive.models
    description: "3D point cloud or mesh models generated from drone captures of an asset. The central entity that most 3D objects (volumes, areas, points, measurements) belong to. Contains georeferencing, scale, and spatial reference data."

    joins:
      - name: Models
        sql: "{TABLE}.parent_model_id = {Models}.id"
        relationship: many_to_one

    measures:
      - name: count
        type: count
        description: "Total number of models"

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true
      - name: ddb_id
        sql: ddb_id
        type: string
        description: "Legacy identifier from an external database"
      - name: ddb_parent_id
        sql: ddb_parent_id
        type: string
        description: "Legacy parent identifier"
      - name: asset_version_id
        sql: asset_version_id
        type: string
        description: "The asset version this model was created for"
      - name: created_by
        sql: created_by
        type: string
      - name: created_on
        sql: created_on
        type: time
      - name: display_name
        sql: display_name
        type: string
      - name: is_deleted
        sql: is_deleted
        type: boolean
        description: "Whether this model has been soft-deleted"
      - name: frust_size
        sql: frust_size
        type: number
        description: "Camera frustum size parameter for 3D rendering"
      - name: georef
        sql: georef
        type: string
        description: "JSON object containing georeferencing transformation data"
      - name: ground_plane_id
        sql: ground_plane_id
        type: string
        description: "Reference to the ground plane object in the model"
      - name: highest_appurtenance_id
        sql: highest_appurtenance_id
        type: string
        description: "Reference to the topmost appurtenance volume"
      - name: object_production
        sql: object_production
        type: string
        description: "JSON metadata about how 3D objects were produced"
      - name: radius
        sql: radius
        type: number
        description: "Bounding radius of the model in meters"
      - name: scale_ratio
        sql: scale_ratio
        type: number
        description: "Scale factor applied to the model"
      - name: site_3d_data
        sql: site_3d_data
        type: string
        description: "JSON object with site-level 3D spatial data"
      - name: srs
        sql: srs
        type: string
        description: "Spatial Reference System (coordinate system) used for georeferencing"
      - name: top_steel_id
        sql: top_steel_id
        type: string
        description: "Reference to the top steel structure point/volume"
      - name: parent_model_id
        sql: parent_model_id
        type: string
        description: "Parent model for hierarchical model relationships"
      - name: slice_plane_1
        sql: slice_plane_1
        type: string
        description: "First slicing plane definition for cross-section views"
      - name: slice_plane_2
        sql: slice_plane_2
        type: string
        description: "Second slicing plane definition"
      - name: tiles
        sql: tiles
        type: string
        description: "JSON metadata for 3D tile streaming configuration"
      - name: modeling_engine
        sql: modeling_engine
        type: string
        description: "Software engine used to produce the 3D model"
      - name: synced_to_id
        sql: synced_to_id
        type: string
        description: "Another model this model has been synced/aligned with"
      - name: engine
        sql: engine
        type: string
        description: "Processing engine version"
      - name: roll_uncertainty
        sql: roll_uncertainty
        type: number
        description: "Uncertainty in roll angle measurement (degrees)"
      - name: downtilt_uncertainty
        sql: downtilt_uncertainty
        type: number
        description: "Uncertainty in downtilt angle measurement (degrees)"
      - name: azimuth_uncertainty
        sql: azimuth_uncertainty
        type: number
        description: "Uncertainty in azimuth measurement (degrees)"
      - name: scale_uncertainty
        sql: scale_uncertainty
        type: number
        description: "Uncertainty in scale factor"
      - name: autogeoref_method
        sql: autogeoref_method
        type: string
        description: "Method used for automatic georeferencing"
      - name: georef_method
        sql: georef_method
        type: string
        description: "Final georeferencing method applied"
      - name: recapture_sync_status
        sql: recapture_sync_status
        type: string
        description: "Status of syncing with a recaptured model"
      - name: last_completed_date
        sql: last_completed_date
        type: time
        description: "Date the model was last fully processed"
      - name: ground_level_id
        sql: ground_level_id
        type: string
        description: "Reference to the ground level definition"
