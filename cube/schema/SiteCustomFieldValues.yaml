cubes:
  - name: SiteCustomFieldValues
    sql_table: fivebyfive.site_custom_field_values
    description: "Typed custom field values for sites. Supports multiple value types — only one value column is populated per row."

    joins:
      - name: SiteCustomFields
        sql: "{TABLE}.custom_field_id = {SiteCustomFields}.id"
        relationship: many_to_one
      - name: Sites
        sql: "{TABLE}.site_id = {Sites}.id"
        relationship: many_to_one

    measures:
      - name: count
        type: count
        description: "Total number of site custom field values"

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true
      - name: site_id
        sql: site_id
        type: string
        description: "The site this value belongs to"
      - name: custom_field_id
        sql: custom_field_id
        type: string
        description: "The custom field definition this value is for"
      - name: group_id
        sql: group_id
        type: string
        description: "Optional grouping identifier for multi-value fields"
      - name: unit
        sql: unit
        type: string
        description: "Unit of measurement for numeric values"
      - name: value_integer
        sql: value_integer
        type: number
      - name: value_float
        sql: value_float
        type: number
      - name: value_string
        sql: value_string
        type: string
      - name: value_boolean
        sql: value_boolean
        type: boolean
      - name: value_date
        sql: value_date
        type: time
      - name: value_string_list
        sql: value_string_list
        type: string
        description: "Array of string values for list-type fields"
