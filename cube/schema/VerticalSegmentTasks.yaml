cubes:
  - name: VerticalSegmentTasks
    sql_table: fivebyfive.vertical_segment_tasks
    description: "Background processing tasks for computing vertical segment data within a 3D model."

    joins:
      - name: Models
        sql: "{TABLE}.model_id = {Models}.id"
        relationship: many_to_one

    measures:
      - name: count
        type: count
        description: "Total number of vertical segment tasks"

    dimensions:
      - name: id
        sql: id
        type: string
        primary_key: true
      - name: ddb_id
        sql: ddb_id
        type: string
        description: "Legacy identifier from an external database"
      - name: model_id
        sql: model_id
        type: string
        description: "The 3D model being processed"
      - name: created_on
        sql: created_on
        type: time
      - name: details
        sql: details
        type: string
        description: "JSON object with task configuration and details"
      - name: status_update_date
        sql: status_update_date
        type: time
        description: "Timestamp of the last status update"
      - name: task_status
        sql: task_status
        type: string
        description: "Current task status (e.g. pending, running, completed, failed)"
